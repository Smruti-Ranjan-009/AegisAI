name: AegisAI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  incident-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test incident service
        working-directory: services/incident-service
        run: bash mvnw --batch-mode --no-transfer-progress test

  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [telemetry-service, ml-service, rag-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check .

  telemetry-lab-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.11.13
      - name: Test Phase 1 tooling
        run: python -m unittest discover -s tests/telemetry_lab -v
      - name: Lint Phase 1 tooling
        run: python -m ruff check scripts tests/telemetry_lab

  docker-images:
    runs-on: ubuntu-latest
    needs: [incident-service, python-services, telemetry-lab-tools]
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: docker compose build
