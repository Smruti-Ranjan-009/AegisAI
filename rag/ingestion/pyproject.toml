[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-rag-ingestion"
version = "0.1.0"
description = "Deterministic Phase 8 knowledge ingestion for AegisAI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "numpy==2.4.6",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.6",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.1.4",
]

[project.optional-dependencies]
embeddings = [
  "huggingface-hub==1.33.0",
  "sentence-transformers==6.1.0",
  "torch==2.14.1",
  "transformers==5.19.0",
]
test = [
  "pytest==8.4.0",
  "ruff==0.11.13",
]

[project.scripts]
aegis-rag-ingest = "aegis_rag_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the configured PostgreSQL/pgvector database"]
