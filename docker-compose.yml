name: aegisai

services:
  incident-service:
    build:
      context: ./services/incident-service
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${INCIDENT_SERVICE_PORT:-8080}:8080"

  telemetry-service:
    build:
      context: ./services/telemetry-service
    environment:
      PORT: 8001
    ports:
      - "${TELEMETRY_SERVICE_PORT:-8001}:8001"

  ml-service:
    build:
      context: ./services/ml-service
    environment:
      PORT: 8002
    ports:
      - "${ML_SERVICE_PORT:-8002}:8002"

  rag-service:
    build:
      context: ./services/rag-service
    environment:
      PORT: 8003
    ports:
      - "${RAG_SERVICE_PORT:-8003}:8003"
