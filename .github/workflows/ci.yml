name: AegisAI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  incident-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test incident service against Testcontainers PostgreSQL
        working-directory: services/incident-service
        run: bash mvnw --batch-mode --no-transfer-progress test

  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [telemetry-service, ml-service, rag-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check .

  telemetry-lab-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.11.13
      - name: Test Phase 1 tooling
        run: python -m unittest discover -s tests/telemetry_lab -v
      - name: Lint Phase 1 tooling
        run: python -m ruff check scripts tests/telemetry_lab

  feature-engineering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/feature_engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/feature_engineering/pyproject.toml
      - name: Install feature package
        run: python -m pip install -e ".[test]"
      - name: Run feature unit and integration tests
        run: python -m pytest
      - name: Lint feature package
        run: python -m ruff check .

  anomaly-detection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/anomaly_detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/anomaly_detection/pyproject.toml
      - name: Install anomaly package
        run: python -m pip install -e ".[test]"
      - name: Run anomaly unit and small integration tests
        run: python -m pytest
      - name: Lint anomaly package
        run: python -m ruff check .

  incident-classification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/incident_classification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/anomaly_detection/pyproject.toml
            ml/incident_classification/pyproject.toml
      - name: Install frozen anomaly and classification packages
        run: |
          python -m pip install -e "../anomaly_detection"
          python -m pip install -e ".[test]"
      - name: Run classification unit and small integration tests
        run: python -m pytest
      - name: Lint classification package
        run: python -m ruff check .

  model-lifecycle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml/model_lifecycle
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/model_lifecycle/pyproject.toml
      - name: Configure MLflow test environment
        shell: bash
        run: |
          echo "AEGIS_MLFLOW_RUNTIME_ROOT=$RUNNER_TEMP/aegis-mlflow" >> "$GITHUB_ENV"
          echo "MLFLOW_TRACKING_URI=sqlite:///$RUNNER_TEMP/aegis-mlflow/mlflow.db" >> "$GITHUB_ENV"
          echo "MLFLOW_ARTIFACT_ROOT=$RUNNER_TEMP/aegis-mlflow/artifacts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/aegis-mlflow/artifacts"
      - name: Install lifecycle package
        run: python -m pip install -e ".[test]"
      - name: Run lifecycle unit and SQLite registry integration tests
        run: python -m pytest
      - name: Lint lifecycle package
        run: python -m ruff check .

  rag-ingestion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: aegis_rag_test
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: rag/ingestion
    env:
      AEGIS_RAG_TEST_DATABASE_URL: postgresql://aegis:aegis_test_password@localhost:5432/aegis_rag_test
      AEGIS_RAG_EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/ingestion/pyproject.toml
      - name: Install ingestion package without model dependencies
        run: python -m pip install -e ".[test]"
      - name: Inspect controlled corpus
        run: python -m aegis_rag_ingestion inspect --json
      - name: Run ingestion unit and pgvector integration tests
        run: python -m pytest
      - name: Lint ingestion package
        run: python -m ruff check .

  rag-retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: aegis_rag_test
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: rag/retrieval
    env:
      AEGIS_RAG_DATABASE_URL: postgresql://aegis:aegis_test_password@localhost:5432/aegis_rag_test
      AEGIS_RAG_TEST_DATABASE_URL: postgresql://aegis:aegis_test_password@localhost:5432/aegis_rag_test
      AEGIS_RAG_EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            rag/ingestion/pyproject.toml
            rag/retrieval/pyproject.toml
      - name: Install ingestion and retrieval packages without model dependencies
        run: |
          python -m pip install -e "../ingestion"
          python -m pip install -e ".[test]"
      - name: Apply the Python-owned RAG schema
        run: python -m aegis_rag_ingestion migrate --json
      - name: Run retrieval unit and pgvector integration tests
        run: python -m pytest
      - name: Validate committed benchmark and qrels against the fixture corpus
        run: python -m aegis_rag_retrieval validate-benchmark --json
      - name: Lint retrieval package
        run: python -m ruff check .

  kafka-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/telemetry-service/requirements.txt
      - name: Install telemetry dependencies
        run: python -m pip install -r services/telemetry-service/requirements.txt
      - name: Start Kafka pipeline
        run: docker compose up -d --build --wait --wait-timeout 180 kafka kafka-init telemetry-worker
      - name: Run Kafka integration tests
        env:
          KAFKA_INTEGRATION: "1"
        run: python -m pytest tests/integration -v
      - name: Show logs on failure
        if: failure()
        run: docker compose logs kafka kafka-init telemetry-worker
      - name: Clean Kafka integration resources
        if: always()
        run: docker compose down -v --remove-orphans

  docker-images:
    runs-on: ubuntu-latest
    needs: [incident-service, python-services, telemetry-lab-tools, feature-engineering, anomaly-detection, incident-classification, model-lifecycle, rag-ingestion, rag-retrieval, kafka-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: docker compose build
