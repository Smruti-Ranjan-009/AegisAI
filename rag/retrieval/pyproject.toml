[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-rag-retrieval"
version = "0.1.0"
description = "Deterministic Phase 9 hybrid retrieval for AegisAI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aegis-rag-ingestion==0.1.0",
  "numpy==2.4.6",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.6",
  "rank-bm25==0.2.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.0",
  "ruff==0.11.13",
]

[project.scripts]
aegis-rag-retrieve = "aegis_rag_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the configured PostgreSQL/pgvector database"]
