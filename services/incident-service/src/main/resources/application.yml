spring:
  application:
    name: incident-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aegisai}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:aegis}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:aegis_dev_password}}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.web.client: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO

aegis:
  intelligence:
    ml-base-url: ${ML_SERVICE_URL:http://localhost:8002}
    rag-base-url: ${RAG_SERVICE_URL:http://localhost:8003}
    ml-connect-timeout: ${ML_CONNECT_TIMEOUT:2s}
    ml-read-timeout: ${ML_READ_TIMEOUT:15s}
    rag-connect-timeout: ${RAG_CONNECT_TIMEOUT:2s}
    rag-read-timeout: ${RAG_READ_TIMEOUT:330s}
